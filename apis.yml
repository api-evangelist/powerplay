name: Powerplay
description: 'Powerplay is a construction project management platform built by Coffer
  Internet Services Pvt. Ltd. (Bengaluru, India) that gives builders, general contractors,
  subcontractors, project managers, and site engineers mobile and desktop tools to
  run construction projects end to end: real-time work and progress tracking, material
  procurement and inventory management, labor attendance and payroll, issue tracking,
  petty-cash and expense management, and reporting dashboards. The product is delivered
  primarily through iOS and Android field apps with a desktop companion. Powerplay
  does not currently publish a public developer API, SDKs, or API documentation, so
  this profile captures its identity and web surface for the API Evangelist network.'
